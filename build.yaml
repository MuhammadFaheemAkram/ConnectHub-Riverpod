targets:
  $default:
    builders:
      source_gen:combining_builder:
        options:
          # Lint headers for generated parts (riverpod_generator,
          # go_router_builder, and later freezed, json_serializable and
          # drift), so generated files can stay inside the analyzer's scope
          # and still report compile errors.
          ignore_for_file:
            - type=lint
